<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>固定动作集中复核</title><link rel="stylesheet" href="/motion-cohort.css">
<header><h1>固定动作集中复核</h1><a href="/motions.html">动作中心</a></header>
<p>源动作类别仍需对照实际播放核实。逐个候选查看和记录阶段结论；技术异常保持原结果，不会因视觉接受而消失。</p>
<nav><label>动作 <select id="motion"></select></label><label>角色 <select id="character"></select></label>
<button id="previous">上一项</button><button id="next">下一项</button><span id="position"></span></nav>
<p id="status" role="status">正在读取复核清单…</p>
<main><section><h2>源骨架</h2>
<label>观察视角 <select id="source-view"><option value="">来源视角</option><option value="front">正面 X/Y</option><option value="side">侧面 −Z/Y</option></select></label>
<p>仅切换源骨架观察方向，不修改角色投影或动作。侧面用于检查肢体深度；前方符号仍以来源坐标约定为准。</p>
<canvas id="source" width="400" height="500"></canvas>
<label>源动作时间 <input id="time" type="range" min="0" max="1" step="0.001" value="0" disabled></label>
<button id="play" disabled>播放</button><span id="time-label"></span>
<p id="sync-status" role="status">使用此时间轴同步源骨架和角色。源骨架采用预览采样，角色窗口使用实际 Runtime。</p></section>
<section><h2 id="target-title">角色候选</h2><div id="target"></div><div id="review"></div></section></main>
<section id="alternative" hidden aria-live="polite"></section>
<section id="experiments" aria-live="polite"></section>
<script type="module" src="/modules/motion-cohort.js"></script></html>
