<!doctype html><meta charset="utf-8"><title>肩部连接对应核查</title>
<style>
body{background:#14212c;color:#eef3f8;font:16px system-ui;margin:24px}button,select{font:inherit;padding:8px;background:#233849;color:white;border:1px solid #758899;border-radius:4px}label{margin-right:16px}.panels{display:flex;gap:24px;align-items:flex-start}figure{margin:12px 0;flex:1;min-width:0}svg{width:100%;height:540px;background:repeating-conic-gradient(#34414d 0% 25%,#26323d 0% 50%) 0/20px 20px}circle{cursor:pointer;stroke:#101820;stroke-width:1;vector-effect:non-scaling-stroke}pre{white-space:pre-wrap;overflow-wrap:anywhere}p{max-width:1100px;line-height:1.6}
</style>
<h1>肩部连接对应核查</h1><p>点击任一橙点，同时定位手臂与躯干原纹理中的对应位置。它们只是被拒绝实验的自动选点，不表示真实缝合点。纹理保持原字节。右图是原动作中同一材料位置与“跟随躯干”目标的分离；不包含完整角色遮挡，也不是 Runtime 渲染。</p>
<label>角色 <select id="character"></select></label><label>顶点 <select id="anchor"></select></label><label>采样时刻 <select id="frame"></select></label>
<div class="panels"><figure><figcaption>手臂原纹理</figcaption><svg id="arm"></svg></figure><figure><figcaption>躯干原纹理</figcaption><svg id="body"></svg></figure><figure><figcaption>同帧对应：橙色原手臂，蓝色躯干目标</figcaption><svg id="motion"></svg></figure></div><pre id="detail"></pre>
<script>
const data=/*DATA*/;const el=id=>document.getElementById(id);let row,selected=0;
const option=(value,text)=>{const n=document.createElement('option');n.value=value;n.textContent=text;return n};
data.rows.forEach((r,i)=>el('character').append(option(i,r.character)));
function svgNode(tag,attrs){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}
function choose(i){selected=i;el('anchor').value=i;draw()}
function texture(id,t){const svg=el(id);svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${t.width} ${t.height}`);svg.append(svgNode('image',{href:t.url,width:t.width,height:t.height}));t.points.forEach((p,i)=>{const c=svgNode('circle',{cx:p[0],cy:p[1],r:Math.max(t.width,t.height)*(i===selected?.012:.006),fill:i===selected?'#fff':'#ff9b42'});const title=svgNode('title',{});title.textContent=`顶点 ${row.anchors[i]}`;c.append(title);c.addEventListener('click',()=>choose(i));svg.append(c)})}
function draw(){texture('arm',row.textures[0]);texture('body',row.textures[1]);const f=row.frames[Number(el('frame').value)];const svg=el('motion');svg.replaceChildren();const pts=f.arm.concat(f.target),xs=pts.map(p=>p[0]),ys=pts.map(p=>-p[1]);let x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y,pad=Math.max(w,h,1)*.15;svg.setAttribute('viewBox',`${x-pad} ${y-pad} ${w+2*pad} ${h+2*pad}`);f.arm.forEach((p,i)=>{const q=f.target[i];svg.append(svgNode('line',{x1:p[0],y1:-p[1],x2:q[0],y2:-q[1],stroke:i===selected?'white':'#647888','stroke-width':i===selected?2:1,'vector-effect':'non-scaling-stroke'}));for(const [v,color] of [[p,'#ff9b42'],[q,'#44caff']]){const c=svgNode('circle',{cx:v[0],cy:-v[1],r:pad*(i===selected?.22:.12),fill:color});c.addEventListener('click',()=>choose(i));svg.append(c)}});el('detail').textContent=`${row.character} · 顶点 ${row.anchors[selected]} · ${f.time} 秒\n原位置至躯干目标距离：${f.gap[selected].toFixed(3)} px\n候选：${row.artifact}\n诊断报告：${data.report_sha256}\n只读定位；没有修改纹理、网格、绑定或人工验收。`}
function load(){row=data.rows[Number(el('character').value)];selected=0;el('anchor').replaceChildren(...row.anchors.map((v,i)=>option(i,v)));el('frame').replaceChildren(...row.frames.map((f,i)=>option(i,f.time+' 秒')));draw()}
el('character').addEventListener('change',load);el('anchor').addEventListener('change',()=>choose(Number(el('anchor').value)));el('frame').addEventListener('change',draw);load();
</script>
