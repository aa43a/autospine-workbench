[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autospine-workbench"
version = "0.1.0"
description = "Local review workbench for See-through layer audits and version-neutral rig overrides"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5"]
analysis = ["numpy>=2,<3", "Pillow>=11,<13"]
cloth-solver = ["numpy==2.4.6", "scipy==1.18.0"]

[project.scripts]
autospine-workbench = "autospine_workbench.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autospine_workbench.benchmark" = ["elbow_bake_player.js", "elbow_bake_webgl.js"]
